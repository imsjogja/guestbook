# GuestFlow - Docker Compose Development Environment
# Services: PostgreSQL 16, Redis 7, GOWA, Go App, Nginx
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#   docker compose exec app make migrate-up
#   docker compose exec -T db psql -U guestflow -d guestflow < seeds/seed_data.sql

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 - Primary Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: guestflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: guestflow
      POSTGRES_PASSWORD: guestflow
      POSTGRES_DB: guestflow
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guestflow

  # ---------------------------------------------------------------------------
  # Redis 7 - Cache, Sessions, Rate Limiting, Job Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: guestflow-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guestflow

  # ---------------------------------------------------------------------------
  # Mailpit - local SMTP inbox for email verification testing
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: guestflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    expose:
      - "1025"
    networks:
      - guestflow

  # ---------------------------------------------------------------------------
  # Database migrations
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: guestflow-migrate
    restart: "no"
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: guestflow
      DB_USER: guestflow
      DB_PASSWORD: guestflow
      DB_SSL_MODE: disable
      JWT_SECRET: dev-secret-change-in-production
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY: 168h
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app/migrate"]
    command: ["up"]
    networks:
      - guestflow

  # ---------------------------------------------------------------------------
  # GOWA - self-hosted WhatsApp Web REST API
  # ---------------------------------------------------------------------------
  gowa:
    image: ghcr.io/aldinokemal/go-whatsapp-web-multidevice:v8.6.0
    container_name: guestflow-gowa
    restart: unless-stopped
    environment:
      APP_PORT: 3000
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH:-gowa-user:gowa-pass}
      APP_OS: GuestFlow
      WHATSAPP_ACCOUNT_VALIDATION: "false"
      WHATSAPP_WEBHOOK: http://app:8080/api/v1/webhooks/gowa
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_GOWA_WEBHOOK_SECRET:-local-gowa-webhook-secret}
      WHATSAPP_WEBHOOK_EVENTS: message.ack
    volumes:
      - gowa_data:/app/storages
    ports:
      - "${HOST_GOWA_PORT:-13000}:3000"
    expose:
      - "3000"
    networks:
      - guestflow

  # ---------------------------------------------------------------------------
  # GuestFlow Application Server
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: guestflow-app
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: guestflow
      DB_USER: guestflow
      DB_PASSWORD: guestflow
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-in-production
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY: 168h
      RATE_LIMIT_REQUESTS_PER_SECOND: 60
      RATE_LIMIT_BURST: 10
      CORS_ALLOWED_ORIGINS: "*"
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_GOWA_API_URL: ${WHATSAPP_GOWA_API_URL:-http://gowa:3000}
      WHATSAPP_GOWA_DEVICE_ID: ${WHATSAPP_GOWA_DEVICE_ID:-guestflow-main}
      WHATSAPP_GOWA_USERNAME: ${WHATSAPP_GOWA_USERNAME:-gowa-user}
      WHATSAPP_GOWA_PASSWORD: ${WHATSAPP_GOWA_PASSWORD:-gowa-pass}
      WHATSAPP_GOWA_WEBHOOK_SECRET: ${WHATSAPP_GOWA_WEBHOOK_SECRET:-local-gowa-webhook-secret}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@guestflow.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-GuestFlow Local}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      gowa:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - guestflow

  # ---------------------------------------------------------------------------
  # Background Queue Workers
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: guestflow-worker
    restart: unless-stopped
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: guestflow
      DB_USER: guestflow
      DB_PASSWORD: guestflow
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_POOL_SIZE: 32
      JWT_SECRET: dev-secret-change-in-production
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY: 168h
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_GOWA_API_URL: ${WHATSAPP_GOWA_API_URL:-http://gowa:3000}
      WHATSAPP_GOWA_DEVICE_ID: ${WHATSAPP_GOWA_DEVICE_ID:-guestflow-main}
      WHATSAPP_GOWA_USERNAME: ${WHATSAPP_GOWA_USERNAME:-gowa-user}
      WHATSAPP_GOWA_PASSWORD: ${WHATSAPP_GOWA_PASSWORD:-gowa-pass}
      WHATSAPP_GOWA_WEBHOOK_SECRET: ${WHATSAPP_GOWA_WEBHOOK_SECRET:-local-gowa-webhook-secret}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@guestflow.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-GuestFlow Local}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      gowa:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - guestflow
    entrypoint: ["/app/worker"]
    command: ["-queues=all", "-concurrency=3"]

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Optional - for local HTTPS simulation)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: guestflow-nginx
    restart: unless-stopped
    ports:
      - "${HOST_NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - guestflow

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible Object Storage (Optional)
  # ---------------------------------------------------------------------------
  minio:
    profiles:
      - optional
    image: minio/minio:latest
    container_name: guestflow-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: guestflow
      MINIO_ROOT_PASSWORD: guestflow123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - guestflow

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  gowa_data:
    driver: local

networks:
  guestflow:
    driver: bridge
